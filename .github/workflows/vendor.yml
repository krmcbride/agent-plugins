name: vendor

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check each generated plugin matches what vendor/ builds, and each upstream copy its pin
        run: |
          status=0
          for pin in vendor/*/upstream.json; do
            name=$(basename "$(dirname "$pin")")
            node scripts/vendor.mjs check "$name" || status=1
            node scripts/vendor.mjs verify "$name" || status=1
          done
          exit $status
